<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Stocks Trading System</title>
    <link rel="stylesheet" href="css/common.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        body {
            background-color: var(--bg-dark);
            color: #f8fafc;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        .main-content {
            padding: 24px;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 20px;
            height: 100%;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 8px;
            padding: 16px;
            border-left: 4px solid var(--accent-color, #6366f1);
        }

        .stat-label {
            font-size: 0.75rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 1.25rem;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
        }

        .market-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding: 8px 0;
            transition: transform 0.2s;
        }

        .market-row:hover {
            transform: translateX(4px);
        }

        .market-row:last-child {
            border-bottom: none;
        }

        .text-up-dim {
            color: #4ade80;
        }

        .text-down-dim {
            color: #f87171;
        }

        .table-dark-custom {
            --bs-table-bg: transparent;
            --bs-table-color: #f8fafc;
            --bs-table-border-color: rgba(255, 255, 255, 0.08);
        }

        .badge-subtle {
            background: rgba(255, 255, 255, 0.05);
            color: #94a3b8;
            font-size: 0.7rem;
            padding: 4px 8px;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background: #4ade80;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            box-shadow: 0 0 10px #4ade80;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.7);
            }

            70% {
                transform: scale(1);
                box-shadow: 0 0 0 10px rgba(74, 222, 128, 0);
            }

            100% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(74, 222, 128, 0);
            }
        }

        #content {
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }

        .alert-surge {
            background-color: rgba(34, 197, 94, 0.15);
            border-color: rgba(34, 197, 94, 0.3);
            color: #4ade80;
        }

        .alert-plunge {
            background-color: rgba(239, 68, 68, 0.15);
            border-color: rgba(239, 68, 68, 0.3);
            color: #f87171;
        }
    </style>
</head>

<body>
    <!-- Sidebar Container -->
    <div id="sidebar-container"></div>

    <div class="main-content">
        <div class="container-fluid">
            <!-- Header -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="h3 fw-bold mb-0">Market Monitor</h1>
                    <p class="text-muted small mb-0">市場概況とリアルタイム・アラート</p>
                </div>
                <div class="text-end">
                    <div class="small fw-semibold"><span class="live-dot"></span>System Active</div>
                    <div id="lastUpdated" class="text-muted tiny">--:--:-- 更新</div>
                </div>
            </div>

            <!-- Alerts Section -->
            <div id="alerts-container"></div>

            <div id="content">
                <div class="row g-4">
                    <!-- Portfolio Summary -->
                    <div class="col-lg-4">
                        <div class="glass-panel">
                            <h5 class="fw-bold mb-4">Portfolio Summary</h5>
                            <div class="d-flex flex-column gap-3">
                                <div class="stat-card" style="--accent-color: #6366f1;">
                                    <div class="stat-label">Total Assets</div>
                                    <div id="totalValue" class="stat-value">---,--- JPY</div>
                                </div>
                                <div class="stat-card" style="--accent-color: #10b981;">
                                    <div class="stat-label">Total Gain/Loss</div>
                                    <div class="d-flex align-items-center gap-2">
                                        <span id="gainLoss" class="stat-value">---,--- JPY</span>
                                        <span id="gainLossPct" class="fw-bold">--%</span>
                                    </div>
                                </div>
                                <div class="stat-card" style="--accent-color: #f59e0b;">
                                    <div class="stat-label">YTD Performance</div>
                                    <div class="d-flex align-items-center gap-2">
                                        <span id="ytdGainLoss" class="stat-value">---,--- JPY</span>
                                        <span id="ytdGainLossPct" class="fw-bold">--%</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Market Indices -->
                    <div class="col-lg-8">
                        <div class="glass-panel">
                            <h5 class="fw-bold mb-4">Market Overview</h5>
                            <div id="indices-container" class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-3">
                                <!-- JS handles rendering indices cards -->
                            </div>
                        </div>
                    </div>

                    <!-- Watchlist Table -->
                    <div class="col-12">
                        <div class="glass-panel">
                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <h5 class="fw-bold mb-0">Watchlist Status</h5>
                                <button class="btn btn-sm btn-outline-light border-secondary">View All</button>
                            </div>
                            <div class="table-responsive">
                                <table class="table table-dark-custom align-middle">
                                    <thead>
                                        <tr>
                                            <th>Symbol / Name</th>
                                            <th class="text-end">Price</th>
                                            <th class="text-end">Change %</th>
                                            <th class="text-center">RSI(14)</th>
                                            <th class="text-center">Vol Ratio</th>
                                            <th class="text-center">Status</th>
                                        </tr>
                                    </thead>
                                    <tbody id="watchlist-tbody">
                                        <tr>
                                            <td colspan="6" class="text-center p-5">
                                                <div class="spinner-border spinner-border-sm text-light" role="status">
                                                </div>
                                                <span class="ms-2">Loading data...</span>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/common.js"></script>
    <script src="js/monitor.js"></script>
</body>

</html>

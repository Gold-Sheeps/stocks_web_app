<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>株式市場モニター - Trading System</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/monitor.css">
</head>

<body>
    <div id="sidebar-container"></div>

    <div class="main-content">
        <div class="container">
            <div class="page-header">
                <div class="page-title">
                    <span>📊</span> Market Monitor
                </div>
                <div style="display: flex; align-items: center; gap: 12px;">
                    <div class="live-indicator">
                        <div class="live-dot"></div>
                        <span>LIVE</span>
                    </div>
                    <div class="text-muted text-sm" id="lastUpdated">Updating...</div>
                </div>
            </div>

            <div id="content" style="opacity:0; transition:opacity 0.5s ease;">
                <div class="market-grid">
                    <!-- Global Equities -->
                    <div class="glass-panel fade-in stagger-1">
                        <div class="panel-header">
                            <div class="panel-title">
                                <span class="badge badge-danger">📉</span> Global Equities
                            </div>
                        </div>
                        <div class="flex-col" id="indices"></div>
                    </div>

                    <!-- Rates & Bonds -->
                    <div class="glass-panel fade-in stagger-2">
                        <div class="panel-header">
                            <div class="panel-title">
                                <span class="badge badge-warning">🏛️</span> Rates & Bonds
                            </div>
                        </div>
                        <div class="flex-col" id="rates"></div>
                    </div>

                    <!-- Currencies -->
                    <div class="glass-panel fade-in stagger-3">
                        <div class="panel-header">
                            <div class="panel-title">
                                <span class="badge badge-success">💱</span> Currencies
                            </div>
                        </div>
                        <div class="flex-col" id="fxRates"></div>
                    </div>

                    <!-- Commodities -->
                    <div class="glass-panel fade-in stagger-4">
                        <div class="panel-header">
                            <div class="panel-title">
                                <span class="badge badge-warning">🥇</span> Commodities
                            </div>
                        </div>
                        <div class="flex-col" id="commodities"></div>
                    </div>

                    <!-- Crypto -->
                    <div class="glass-panel fade-in stagger-5">
                        <div class="panel-header">
                            <div class="panel-title">
                                <span class="badge badge-accent">₿</span> Crypto
                            </div>
                        </div>
                        <div class="flex-col" id="crypto"></div>
                    </div>
                </div>

                <!-- Portfolio Summary -->
                <div class="glass-panel mt-4 fade-in" style="animation-delay: 0.6s;">
                    <div class="panel-header">
                        <div class="panel-title">
                            <span class="badge badge-accent">💼</span> Portfolio Overview
                        </div>
                    </div>
                    <div
                        style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: var(--sp-6); align-items: start;">
                        <div class="flex-col gap-3">
                            <div class="stat-card">
                                <div class="stat-label">Total Assets</div>
                                <div class="stat-value" id="totalValue">---</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-label">Total Gain/Loss</div>
                                <div class="d-flex gap-2 items-center">
                                    <span class="stat-value" id="gainLoss">---</span>
                                    <span id="gainLossPct"></span>
                                </div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-label">YTD Performance</div>
                                <div class="d-flex gap-2 items-center">
                                    <span class="stat-value" id="ytdGainLoss">---</span>
                                    <span id="ytdGainLossPct"></span>
                                </div>
                            </div>
                        </div>
                        <div class="flex-col items-center">
                            <div class="text-muted text-sm mb-4">Capital Allocation</div>
                            <div style="width: 200px; height: 200px;">
                                <canvas id="portfolioPieChart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/common.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="js/monitor.js"></script>
</body>

</html>

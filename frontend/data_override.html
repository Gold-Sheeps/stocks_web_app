<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Override - Trading System</title>
  <link rel="stylesheet" href="css/common.css">
  <style>
    /* ---- Tab navigation ---- */
    .tab-group {
      display: flex;
      gap: 4px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: var(--radius-md);
      padding: 4px;
      margin-bottom: 20px;
      overflow-x: auto;
    }
    .tab-btn {
      padding: 8px 18px;
      border-radius: var(--radius-sm);
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      font-size: var(--fs-sm);
      font-weight: 500;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .tab-btn:hover { color: var(--text); background: rgba(255,255,255,0.05); }
    .tab-btn.active { background: var(--primary); color: #fff; }
    .tab-pane { display: none; }
    .tab-pane.active { display: block; }

    /* ---- Search ---- */
    .search-wrap { position: relative; }
    .search-dropdown {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      z-index: 500;
      background: var(--bg-surface);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: var(--radius-sm);
      max-height: 220px;
      overflow-y: auto;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .search-item {
      padding: 8px 14px;
      cursor: pointer;
      font-size: var(--fs-sm);
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .search-item:last-child { border-bottom: none; }
    .search-item:hover { background: rgba(99,102,241,0.15); }

    /* ---- Category buttons ---- */
    .cat-btns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
    .cat-btn {
      padding: 5px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.04);
      color: var(--text-muted);
      cursor: pointer;
      font-size: var(--fs-xs);
      font-weight: 500;
      transition: all 0.2s;
    }
    .cat-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.3); }
    .cat-btn.active { background: rgba(99,102,241,0.25); color: var(--primary); border-color: var(--primary); }

    /* ---- Data table ---- */
    .table-wrap { overflow-x: auto; }
    .data-table { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); }
    .data-table th {
      padding: 8px 12px;
      text-align: left;
      font-size: var(--fs-xs);
      font-weight: 600;
      color: var(--text-muted);
      background: rgba(255,255,255,0.04);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      white-space: nowrap;
    }
    .data-table td {
      padding: 6px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      vertical-align: middle;
    }
    .data-table tr:last-child td { border-bottom: none; }
    .data-table tr.missing-row td { background: rgba(239,68,68,0.07); }
    .edit-input {
      width: 130px;
      padding: 4px 8px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 4px;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: var(--fs-xs);
    }
    .edit-input:focus { outline: none; border-color: var(--primary); background: rgba(99,102,241,0.1); }
    .edit-input.changed { border-color: #f59e0b; background: rgba(245,158,11,0.1); }
    .ro-label { font-size: var(--fs-xs); color: var(--text-muted); font-style: italic; }

    /* ---- Action row ---- */
    .action-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
    .ml-2 { margin-left: 8px; }
    .mb-4 { margin-bottom: 16px; }
    .mt-2 { margin-top: 8px; }
    .mt-3 { margin-top: 12px; }
    .text-xs { font-size: var(--fs-xs); }
  </style>
</head>
<body>
  <div id="sidebar-container"></div>
  <div class="main-content">
    <div class="container">

      <!-- Page header -->
      <div class="page-header">
        <div class="page-title">Data Override</div>
        <div class="text-muted text-sm">DB データの直接確認・修正</div>
      </div>

      <!-- Tab navigation -->
      <div class="tab-group">
        <button class="tab-btn active" data-tab="symbol">銘柄データ</button>
        <button class="tab-btn" data-tab="market">Market Environment</button>
        <button class="tab-btn" data-tab="csv">一括 CSV</button>
      </div>

      <!-- ===== Tab 1: Symbol Data ===== -->
      <div id="tab-symbol" class="tab-pane active">

        <!-- Search panel -->
        <div class="glass-panel mb-4">
          <div class="panel-header">
            <div class="panel-title">銘柄検索</div>
          </div>
          <div class="search-wrap">
            <input id="symbolSearch" type="text" class="form-input"
                   placeholder="銘柄コードまたは名称を入力 (例: AAPL, NVDA, US:QQQ)"
                   autocomplete="off" style="max-width:400px;">
            <div id="searchDropdown" class="search-dropdown" style="display:none;"></div>
          </div>
          <div id="selectedInfo" class="text-muted text-sm mt-2" style="display:none;"></div>
          <div class="cat-btns">
            <button class="cat-btn active" data-cat="all">全て</button>
            <button class="cat-btn" data-cat="price">価格</button>
            <button class="cat-btn" data-cat="indicator">テクニカル</button>
            <button class="cat-btn" data-cat="fundamental">ファンダメンタルズ</button>
            <button class="cat-btn" data-cat="ratio">財務比率</button>
          </div>
        </div>

        <!-- Missing alert -->
        <div id="missingAlert" style="display:none;" class="mb-4"></div>

        <!-- Data panels -->
        <div id="dataContainer"></div>

        <!-- Action row -->
        <div id="actionRow" style="display:none;" class="action-row mb-4">
          <button class="btn-primary" id="btnSave">変更を保存</button>
          <button class="btn-ghost" id="btnReset">リセット</button>
          <div id="saveResult" class="text-sm"></div>
        </div>
      </div>

      <!-- ===== Tab 2: Market Environment ===== -->
      <div id="tab-market" class="tab-pane">
        <div id="marketContainer"><div class="text-muted text-sm">タブを開くと読み込みます...</div></div>
        <div id="marketActionRow" style="display:none;" class="action-row mb-4">
          <button class="btn-primary" id="btnMarketSave">変更を保存</button>
          <button class="btn-ghost" id="btnMarketReset">リセット</button>
          <div id="marketSaveResult" class="text-sm"></div>
        </div>
      </div>

      <!-- ===== Tab 3: CSV ===== -->
      <div id="tab-csv" class="tab-pane">
        <!-- Export -->
        <div class="glass-panel mb-4">
          <div class="panel-header"><div class="panel-title">CSV エクスポート</div></div>
          <p class="text-muted text-sm mb-4">
            銘柄データを CSV テンプレートとしてダウンロードします。<br>
            <code>new_value</code> 列に値を入力して保存後、下のインポートで一括更新できます。
          </p>
          <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
            <input id="csvSymbol" type="text" class="form-input"
                   placeholder="銘柄コード (例: US:AAPL)" style="max-width:200px;" autocomplete="off">
            <select id="csvCategory" class="form-input" style="max-width:160px;">
              <option value="all">全て</option>
              <option value="price">価格</option>
              <option value="indicator">テクニカル</option>
              <option value="fundamental">ファンダメンタルズ</option>
              <option value="ratio">財務比率</option>
            </select>
            <button class="btn-primary" id="btnDownloadCsv">CSV をダウンロード</button>
          </div>
        </div>
        <!-- Import -->
        <div class="glass-panel">
          <div class="panel-header"><div class="panel-title">CSV インポート</div></div>
          <p class="text-muted text-sm mb-4">
            テンプレートの <code>new_value</code> 列を埋めたCSVをアップロードすると一括更新します。
          </p>
          <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
            <input type="file" id="csvFile" accept=".csv" class="form-input" style="max-width:320px;">
            <button class="btn-primary" id="btnUploadCsv">アップロード &amp; 適用</button>
          </div>
          <div id="importResult" class="mt-3"></div>
        </div>
      </div>

    </div><!-- /container -->
  </div><!-- /main-content -->

  <script defer src="js/config.js"></script>
  <script defer src="js/common.js"></script>
  <script>
  (function () {
    'use strict';

    // ---- State ----
    let API_BASE = 'http://localhost:8010/api/v1';
    let currentSymbol = null;
    let currentCategory = 'all';
    let symbolData = null;
    let marketData = null;
    let rowIds = {};          // table -> {col: val} WHERE clause
    let searchTimer = null;
    let marketLoaded = false;

    // Primary key columns per table (used to build row_id)
    const TABLE_PK = {
      price_daily:               ['trading_date', 'symbol_key'],
      indicator_daily:           ['trading_date', 'symbol_key'],
      fundamentals:              ['period_end_date', 'symbol'],
      fundamentals_ratios_latest:['symbol', 'as_of_date'],
    };

    // Columns that must not be edited (identifiers, timestamps)
    const READONLY_COLS = new Set([
      'symbol_key', 'symbol_key_old_backup', 'symbol',
      'trading_date', 'period_end_date', 'as_of_date',
      'updated_at', 'calculated_at', 'created_at', 'version', 'source',
    ]);

    // ================================================================
    // Init
    // ================================================================
    function init() {
      if (window.CONFIG?.API_BASE) API_BASE = window.CONFIG.API_BASE;

      // Tab buttons
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => switchTab(btn.dataset.tab));
      });

      // Symbol search
      const srch = document.getElementById('symbolSearch');
      srch.addEventListener('input', e => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => fetchSuggestions(e.target.value), 280);
      });
      srch.addEventListener('blur', () => {
        setTimeout(() => {
          document.getElementById('searchDropdown').style.display = 'none';
        }, 200);
      });

      // Category buttons
      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentCategory = btn.dataset.cat;
          if (currentSymbol) loadSymbolData(currentSymbol);
        });
      });

      // Save / Reset
      document.getElementById('btnSave').addEventListener('click', saveChanges);
      document.getElementById('btnReset').addEventListener('click', resetChanges);
      document.getElementById('btnMarketSave').addEventListener('click', saveMarketChanges);
      document.getElementById('btnMarketReset').addEventListener('click', resetMarketChanges);

      // CSV
      document.getElementById('btnDownloadCsv').addEventListener('click', downloadCsv);
      document.getElementById('btnUploadCsv').addEventListener('click', uploadCsv);

      // Track input changes
      document.getElementById('dataContainer').addEventListener('input', e => {
        if (e.target.classList.contains('edit-input')) {
          e.target.classList.toggle('changed', e.target.value.trim() !== '');
        }
      });
    }

    // ================================================================
    // Tab switching
    // ================================================================
    function switchTab(id) {
      document.querySelectorAll('.tab-btn').forEach(b =>
        b.classList.toggle('active', b.dataset.tab === id));
      document.querySelectorAll('.tab-pane').forEach(p =>
        p.classList.toggle('active', p.id === `tab-${id}`));
      if (id === 'market' && !marketLoaded) {
        marketLoaded = true;
        loadMarketData();
      }
    }

    // ================================================================
    // Symbol incremental search
    // ================================================================
    async function fetchSuggestions(q) {
      const dd = document.getElementById('searchDropdown');
      if (!q.trim()) { dd.style.display = 'none'; return; }
      try {
        const res = await fetch(
          `${API_BASE}/override/symbols/search?q=${encodeURIComponent(q)}&limit=15`
        );
        const items = await res.json();
        if (!Array.isArray(items) || !items.length) { dd.style.display = 'none'; return; }
        dd.innerHTML = items.map(item =>
          `<div class="search-item" data-sym="${esc(item.symbol_key)}" data-name="${esc(item.name || '')}">
             <strong>${esc(item.symbol_key)}</strong>
             <span class="text-muted"> — ${esc(item.name || '')}</span>
           </div>`
        ).join('');
        dd.style.display = 'block';
        dd.querySelectorAll('.search-item').forEach(el => {
          el.addEventListener('mousedown', ev => {
            ev.preventDefault();
            selectSymbol(el.dataset.sym, el.dataset.name);
          });
        });
      } catch (e) {
        console.error('search error', e);
      }
    }

    function selectSymbol(sym, name) {
      currentSymbol = sym;
      document.getElementById('symbolSearch').value = sym;
      document.getElementById('searchDropdown').style.display = 'none';
      const info = document.getElementById('selectedInfo');
      info.textContent = `選択中: ${sym}${name ? ' — ' + name : ''}`;
      info.style.display = 'block';
      loadSymbolData(sym);
    }

    // ================================================================
    // Load symbol data
    // ================================================================
    async function loadSymbolData(sym) {
      document.getElementById('dataContainer').innerHTML =
        '<div class="text-muted text-sm">読み込み中...</div>';
      document.getElementById('missingAlert').style.display = 'none';
      document.getElementById('actionRow').style.display = 'none';
      try {
        const res = await fetch(
          `${API_BASE}/override/data/${encodeURIComponent(sym)}?category=${currentCategory}`
        );
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        symbolData = await res.json();
        renderMissingAlert('missingAlert', symbolData.missing_count, symbolData.total_count);
        renderDataTable(symbolData.categories);
        document.getElementById('actionRow').style.display = 'flex';
      } catch (e) {
        document.getElementById('dataContainer').innerHTML =
          `<div class="alert alert-danger">データ取得失敗: ${esc(e.message)}</div>`;
      }
    }

    // ================================================================
    // Render missing alert
    // ================================================================
    function renderMissingAlert(elId, missing, total) {
      const el = document.getElementById(elId);
      if (!el) return;
      el.style.display = 'block';
      if (missing > 0) {
        el.innerHTML =
          `<div class="alert alert-warning">⚠️ データ欠損検出: <strong>${missing}件</strong>の欠損があります（全${total}項目中）</div>`;
      } else {
        el.innerHTML =
          `<div class="alert alert-success">✅ 全データが揃っています（${total}項目）</div>`;
      }
    }

    // ================================================================
    // Render editable data tables
    // ================================================================
    function renderDataTable(categories) {
      rowIds = {};
      let html = '';
      for (const [, catData] of Object.entries(categories)) {
        const pks = TABLE_PK[catData.table] || [];
        const rowId = {};
        if (catData.rows.length > 0) {
          for (const pk of pks) {
            const v = catData.rows[0][pk];
            if (v) rowId[pk] = v.value;
          }
        }
        rowIds[catData.table] = rowId;

        const dateKey = rowId.trading_date || rowId.period_end_date || rowId.as_of_date || '';
        const rowCountLabel = catData.row_count === 0 ? ' — データなし' : '';
        const panelTitle = `${catData.label}${dateKey ? ' (' + dateKey + ')' : ''}${rowCountLabel}`;

        html += `<div class="glass-panel mb-4" data-table="${esc(catData.table)}">`;
        html += `<div class="panel-header">`;
        html += `<div class="panel-title">${esc(panelTitle)}</div>`;
        // Period selector for fundamentals (multiple rows)
        if (catData.table === 'fundamentals' && catData.rows.length > 1) {
          html += `<select class="period-select form-input" data-table="fundamentals"
                           style="max-width:150px;padding:4px 8px;font-size:var(--fs-xs);">`;
          catData.rows.forEach((row, idx) => {
            const dt = row.period_end_date?.value || `Row ${idx + 1}`;
            html += `<option value="${idx}">${dt}</option>`;
          });
          html += `</select>`;
        }
        html += `</div>`;

        if (catData.row_count === 0) {
          html += `<div class="text-muted text-sm">このカテゴリのデータが見つかりません</div>`;
        } else {
          html += buildFieldTable(catData.fields, catData.table);
        }
        html += `</div>`;
      }
      document.getElementById('dataContainer').innerHTML = html;

      // Bind period selectors
      document.querySelectorAll('.period-select').forEach(sel => {
        sel.addEventListener('change', e => {
          const tbl = e.target.dataset.table;
          const idx = parseInt(e.target.value, 10);
          switchPeriod(tbl, idx);
        });
      });
    }

    function buildFieldTable(fields, table) {
      const pks = new Set(TABLE_PK[table] || []);
      let html = `<div class="table-wrap"><table class="data-table">`;
      html += `<thead><tr>
        <th>フィールド</th><th>現在の値</th><th>新しい値</th><th>型</th><th>状態</th>
      </tr></thead><tbody>`;

      for (const f of fields) {
        const isRO = READONLY_COLS.has(f.name) || pks.has(f.name);
        const missing = f.missing;
        const rowCls = missing ? ' class="missing-row"' : '';
        const valHtml = f.value != null
          ? `<span style="font-family:var(--font-mono);">${esc(f.value)}</span>`
          : '<span class="text-muted">—</span>';
        const inputHtml = isRO
          ? '<span class="ro-label">読み取り専用</span>'
          : `<input type="text" class="edit-input"
               data-table="${esc(table)}" data-field="${esc(f.name)}"
               placeholder="${missing ? '入力...' : ''}" autocomplete="off">`;
        const badge = missing ? '<span class="badge badge-danger text-xs">欠損</span>' : '';

        html += `<tr${rowCls}>
          <td><code class="text-xs">${esc(f.name)}</code></td>
          <td class="text-sm">${valHtml}</td>
          <td>${inputHtml}</td>
          <td><span class="text-xs text-muted">${esc(f.type)}</span></td>
          <td>${badge}</td>
        </tr>`;
      }
      html += `</tbody></table></div>`;
      return html;
    }

    function switchPeriod(table, rowIdx) {
      if (!symbolData) return;
      const catData = Object.values(symbolData.categories).find(c => c.table === table);
      if (!catData || !catData.rows[rowIdx]) return;

      const row = catData.rows[rowIdx];
      // Rebuild fields from this row
      const fields = Object.entries(row).map(([name, info]) => ({
        name, type: info.type, missing: info.missing, value: info.value,
      }));

      // Update rowId
      const pks = TABLE_PK[table] || [];
      const newRowId = {};
      for (const pk of pks) {
        if (row[pk]) newRowId[pk] = row[pk].value;
      }
      rowIds[table] = newRowId;

      // Re-render tbody in place
      const panel = document.querySelector(`.glass-panel[data-table="${table}"]`);
      if (!panel) return;
      const tmpDiv = document.createElement('div');
      tmpDiv.innerHTML = buildFieldTable(fields, table);
      const newTbody = tmpDiv.querySelector('tbody');
      const oldTbody = panel.querySelector('tbody');
      if (oldTbody && newTbody) oldTbody.replaceWith(newTbody);

      // Update panel title
      const dt = newRowId.period_end_date || newRowId.trading_date || newRowId.as_of_date || '';
      const titleEl = panel.querySelector('.panel-title');
      if (titleEl && dt) titleEl.textContent = `${catData.label} (${dt})`;
    }

    // ================================================================
    // Save changes (symbol tab)
    // ================================================================
    async function saveChanges() {
      const byTable = {};
      document.querySelectorAll('.edit-input').forEach(inp => {
        if (!inp.value.trim()) return;
        const t = inp.dataset.table;
        const f = inp.dataset.field;
        if (!byTable[t]) byTable[t] = { updates: {}, row_id: rowIds[t] || {} };
        byTable[t].updates[f] = inp.value.trim();
      });

      if (!Object.keys(byTable).length) {
        showResult('saveResult', 'warning', '変更がありません');
        return;
      }

      const btn = document.getElementById('btnSave');
      btn.disabled = true; btn.textContent = '保存中...';
      const msgs = [];
      let allOk = true;

      for (const [table, payload] of Object.entries(byTable)) {
        try {
          const res = await fetch(
            `${API_BASE}/override/data/${encodeURIComponent(currentSymbol)}/update`,
            {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ table, updates: payload.updates, row_id: payload.row_id }),
            }
          );
          const r = await res.json();
          if (!res.ok || r.error) {
            allOk = false;
            msgs.push(`${table}: エラー — ${r.error || r.detail}`);
          } else {
            msgs.push(`${table}: ${r.updated}項目更新 (${r.rows_affected}行)`);
          }
        } catch (e) {
          allOk = false;
          msgs.push(`${table}: 失敗 — ${e.message}`);
        }
      }

      btn.disabled = false; btn.textContent = '変更を保存';
      showResult('saveResult', allOk ? 'success' : 'warning', msgs.join(' / '));
      if (allOk) setTimeout(() => loadSymbolData(currentSymbol), 600);
    }

    function resetChanges() {
      document.querySelectorAll('.edit-input').forEach(inp => {
        inp.value = '';
        inp.classList.remove('changed');
      });
      showResult('saveResult', '', '');
    }

    // ================================================================
    // Market Environment tab
    // ================================================================
    async function loadMarketData() {
      document.getElementById('marketContainer').innerHTML =
        '<div class="text-muted text-sm">読み込み中...</div>';
      try {
        const res = await fetch(`${API_BASE}/override/market`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        marketData = await res.json();
        renderMarketTable(marketData);
        document.getElementById('marketActionRow').style.display = 'flex';
      } catch (e) {
        document.getElementById('marketContainer').innerHTML =
          `<div class="alert alert-danger">データ取得失敗: ${esc(e.message)}</div>`;
      }
    }

    function renderMarketTable(data) {
      const fields = data.fields || {};
      let html = '';

      // Alert
      if (data.missing_count > 0) {
        html += `<div class="alert alert-warning mb-4">⚠️ データ欠損: <strong>${data.missing_count}件</strong>（全${data.total_count}項目中）</div>`;
      } else {
        html += `<div class="alert alert-success mb-4">✅ 全データが揃っています（${data.total_count}項目）</div>`;
      }

      html += `<div class="glass-panel mb-4">`;
      html += `<div class="panel-header"><div class="panel-title">Market Environment (${esc(data.check_date || '')})</div></div>`;
      html += `<div class="table-wrap"><table class="data-table">`;
      html += `<thead><tr><th>キー</th><th>現在の値</th><th>新しい値</th><th>型</th><th>状態</th></tr></thead>`;
      html += `<tbody>`;

      for (const [key, val] of Object.entries(fields)) {
        const missing = val === null || val === undefined;
        const rowCls = missing ? ' class="missing-row"' : '';
        const valType = Array.isArray(val) ? 'array' : typeof val;
        const valDisplay = missing
          ? '<span class="text-muted">—</span>'
          : Array.isArray(val)
            ? `<span style="font-family:var(--font-mono);">${esc(val.join(', '))}</span>`
            : `<span style="font-family:var(--font-mono);">${esc(String(val))}</span>`;
        const badge = missing ? '<span class="badge badge-danger text-xs">欠損</span>' : '';

        html += `<tr${rowCls}>
          <td><code class="text-xs">${esc(key)}</code></td>
          <td class="text-sm">${valDisplay}</td>
          <td><input type="text" class="edit-input market-input" data-key="${esc(key)}"
                placeholder="${missing ? '入力...' : ''}" autocomplete="off"></td>
          <td><span class="text-xs text-muted">${esc(valType)}</span></td>
          <td>${badge}</td>
        </tr>`;
      }
      html += `</tbody></table></div></div>`;
      document.getElementById('marketContainer').innerHTML = html;

      // Track changes
      document.getElementById('marketContainer').addEventListener('input', e => {
        if (e.target.classList.contains('edit-input')) {
          e.target.classList.toggle('changed', e.target.value.trim() !== '');
        }
      });
    }

    async function saveMarketChanges() {
      const updates = {};
      document.querySelectorAll('.market-input').forEach(inp => {
        if (inp.value.trim()) updates[inp.dataset.key] = inp.value.trim();
      });
      if (!Object.keys(updates).length) {
        showResult('marketSaveResult', 'warning', '変更がありません');
        return;
      }

      const btn = document.getElementById('btnMarketSave');
      btn.disabled = true; btn.textContent = '保存中...';

      try {
        const res = await fetch(`${API_BASE}/override/market/update`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(updates),
        });
        const r = await res.json();
        btn.disabled = false; btn.textContent = '変更を保存';
        if (!res.ok || r.error) {
          showResult('marketSaveResult', 'warning', `エラー: ${r.error || r.detail}`);
        } else {
          showResult('marketSaveResult', 'success', `${r.updated}項目を更新しました`);
          marketLoaded = false;
          setTimeout(() => { marketData = null; loadMarketData(); }, 600);
        }
      } catch (e) {
        btn.disabled = false; btn.textContent = '変更を保存';
        showResult('marketSaveResult', 'warning', `失敗: ${e.message}`);
      }
    }

    function resetMarketChanges() {
      document.querySelectorAll('.market-input').forEach(inp => {
        inp.value = '';
        inp.classList.remove('changed');
      });
      showResult('marketSaveResult', '', '');
    }

    // ================================================================
    // CSV Export / Import
    // ================================================================
    function downloadCsv() {
      const sym = document.getElementById('csvSymbol').value.trim();
      const cat = document.getElementById('csvCategory').value;
      if (!sym) { alert('銘柄コードを入力してください'); return; }
      window.location.href =
        `${API_BASE}/override/export/csv/${encodeURIComponent(sym)}?category=${cat}`;
    }

    async function uploadCsv() {
      const fileEl = document.getElementById('csvFile');
      if (!fileEl.files.length) { alert('CSVファイルを選択してください'); return; }
      const formData = new FormData();
      formData.append('file', fileEl.files[0]);

      const btn = document.getElementById('btnUploadCsv');
      btn.disabled = true; btn.textContent = 'アップロード中...';

      try {
        const res = await fetch(`${API_BASE}/override/import/csv`, {
          method: 'POST',
          body: formData,
        });
        const r = await res.json();
        btn.disabled = false; btn.textContent = 'アップロード & 適用';

        if (!res.ok || r.error) {
          document.getElementById('importResult').innerHTML =
            `<div class="alert alert-danger">エラー: ${esc(r.error || r.detail)}</div>`;
        } else {
          const details = (r.results || [])
            .map(x => `${x.table}/${x.symbol}: ${x.result.updated || 0}項目`)
            .join(', ');
          document.getElementById('importResult').innerHTML =
            `<div class="alert alert-success">✅ ${r.applied}テーブルを更新しました${details ? ' (' + details + ')' : ''}</div>`;
        }
      } catch (e) {
        btn.disabled = false; btn.textContent = 'アップロード & 適用';
        document.getElementById('importResult').innerHTML =
          `<div class="alert alert-danger">失敗: ${esc(e.message)}</div>`;
      }
    }

    // ================================================================
    // Utilities
    // ================================================================
    function esc(v) {
      return String(v ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function showResult(elId, type, msg) {
      const el = document.getElementById(elId);
      if (!el) return;
      if (!msg) { el.innerHTML = ''; return; }
      const cls = type === 'success' ? 'alert-success'
                : type === 'warning' ? 'alert-warning' : 'alert-danger';
      el.innerHTML = `<div class="alert ${cls}">${esc(msg)}</div>`;
    }

    // Boot
    document.readyState === 'loading'
      ? document.addEventListener('DOMContentLoaded', init)
      : init();
  })();
  </script>
</body>
</html>
